<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitio en mantenimiento | Servi Limpieza JLH</title>
<meta name="description" content="Servi Limpieza JLH está en mantenimiento por un momento. Volvemos muy pronto.">
<style>
  /*
   * PÁGINA DE MANTENIMIENTO — Servi Limpieza JLH
   * Qué es: pantalla única que ven los visitantes mientras el sitio está en mantenimiento.
   *         Por decisión del dueño NO muestra número de teléfono, WhatsApp ni ningún dato de contacto.
   * Cómo se activa: el archivo netlify.toml (raíz del proyecto) redirige "/" e "/index.html" hacia esta página.
   * Cómo se desactiva: borrar netlify.toml (index.html nunca se modificó, sigue intacto).
   * Es 100% autónoma: no depende de Google Sheets ni de scripts externos, así funciona aunque todo lo demás esté apagado.
   * Fuente: Montserrat variable local (la misma del sitio) con respaldo del sistema.
   */
  @font-face {
    font-family: 'Montserrat';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url("assets/fonts/4872d49c-0381-4c9a-9767-24d66a4478e4.woff2") format('woff2');
  }
  :root { --navy:#1a2e6e; --azul:#1e88e5; --texto:#4a5578; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:'Montserrat','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    color:var(--navy);
    background:linear-gradient(160deg,#f2f9ff 0%,#e3f2fd 55%,#d6ecfb 100%);
    display:flex; align-items:center; justify-content:center;
    padding:24px; overflow-x:hidden;
  }
  /* Burbujas decorativas de fondo (solo adorno, sin interacción) */
  .burbuja { position:fixed; border-radius:50%; background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(30,136,229,.12)); pointer-events:none; animation:flota 9s ease-in-out infinite; }
  .b1 { width:140px; height:140px; top:8%; left:7%; }
  .b2 { width:80px; height:80px; bottom:12%; left:18%; animation-delay:-3s; }
  .b3 { width:190px; height:190px; bottom:6%; right:6%; animation-delay:-5s; }
  .b4 { width:60px; height:60px; top:16%; right:20%; animation-delay:-1.5s; }
  @keyframes flota { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-18px); } }

  .tarjeta {
    position:relative; z-index:1; width:100%; max-width:560px; text-align:center;
    background:rgba(255,255,255,.92); border-radius:28px; padding:44px 32px 38px;
    box-shadow:0 24px 60px rgba(26,46,110,.16); border:1px solid rgba(30,136,229,.12);
  }
  .logo { width:min(250px,68%); height:auto; margin:0 auto 22px; display:block; }
  .etiqueta {
    display:inline-block; font-size:.74rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--azul); background:rgba(30,136,229,.1); padding:7px 16px; border-radius:50px; margin-bottom:16px;
  }
  h1 { font-size:clamp(1.6rem,5vw,2.1rem); font-weight:900; line-height:1.2; margin-bottom:14px; }
  p { font-size:1.02rem; line-height:1.65; color:var(--texto); }
  .pie { margin-top:26px; padding-top:20px; border-top:1px solid rgba(26,46,110,.1); font-size:.86rem; color:#7a86a8; }
  @media (max-width:480px) { .tarjeta { padding:34px 20px 30px; border-radius:22px; } }
  @media (prefers-reduced-motion:reduce) { .burbuja { animation:none; } }
</style>
</head>
<body>
  <span class="burbuja b1"></span><span class="burbuja b2"></span><span class="burbuja b3"></span><span class="burbuja b4"></span>

  <main class="tarjeta">
    <img class="logo" src="assets/images/logo-transparent.png" alt="Servi Limpieza JLH">
    <span class="etiqueta">Sitio en mantenimiento</span>
    <h1>Estamos mejorando nuestro sitio</h1>
    <p>ServiLimpieza JLH está en mantenimiento por un momento. Volveremos muy pronto con mejoras para ti.</p>
    <div class="pie">Gracias por tu paciencia. 💧</div>
  </main>
</body>
</html>
